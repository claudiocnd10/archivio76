<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivio 76</title>

<style>
body {
    margin: 0;
    background: #0d0d0d;
    color: #e7dcc3;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
}

.container {
    width: 100%;
    max-width: 1000px;
    text-align: center;
}

.top-text {
    color: #7e7463;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 12px;
    margin-bottom: 20px;
}

.article-box {
    background: #111;
    border: 1px solid #333;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    overflow: hidden;
}

.article-box img {
    width: 100%;
    display: block;
}

.button-area {
    margin-top: 30px;
}

button {
    background: #1a1a1a;
    border: 1px solid #444;
    color: #e7dcc3;
    padding: 16px 40px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 4px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #262626;
}

.footer {
    margin-top: 20px;
    color: #5c5c5c;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

#secondPage {
    text-align: left;
    background: #161616;
    border: 1px solid #333;
    padding: 40px;
    margin-top: 20px;
}

.archive-title {
    font-size: 42px;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: #d8ccb0;
}

.archive-subtitle {
    color: #8c826f;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
    font-size: 14px;
}

.w-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.w-card {
    border: 1px solid #444;
    background: #1c1c1c;
    padding: 25px;
    min-height: 120px;
}

.w-card h2 {
    margin-top: 0;
    color: #d8ccb0;
}

.locked {
    opacity: 0.4;
}

select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    margin-bottom: 20px;
    background: #111;
    color: #e7dcc3;
    border: 1px solid #444;
}

#thirdPage {
    text-align: left;
    background: #161616;
    border: 1px solid #333;
    padding: 40px;
    margin-top: 20px;
}

.lock-msg {
    opacity: 0.5;
    text-align: center;
    padding: 40px;
}

</style>
</head>

<body>

<div class="container">

<!-- PAGINA 1 -->
<div id="firstPage" class="page active">
    <div class="top-text">Archivio digitale recuperato • accesso parziale</div>

    <div class="article-box">
        <img src="img/articolo76.png" alt="Articolo 1976" />
    </div>

    <div class="button-area">
        <button id="proseguiBtn">Continua</button>
    </div>
</div>

<!-- PAGINA 2 -->
<div id="secondPage" class="page">
    <div class="archive-title">Report Indagine</div>
    <div class="archive-subtitle">ricostruzione dell’evento</div>

    <label>Chi</label>
    <select id="who" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Il parroco</option>
        <option>Un operaio</option>
        <option>Il capocantiere</option>
        <option>Suor Agnese</option>
        <option>Un testimone</option>
    </select>

    <label>Cosa</label>
    <select id="what" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Un crollo accidentale</option>
        <option>La fuga di una suora</option>
        <option>Insabbiamento di un incidente</option>
        <option>Un furto nella parrocchia</option>
        <option>Un errore durante i lavori</option>
    </select>

    <label>Dove</label>
    <select id="where" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Sagrestia</option>
        <option>Campanile</option>
        <option>Seminterrato della parrocchia</option>
        <option>Cortile interno</option>
        <option>Archivio della chiesa</option>
    </select>

    <label>Quando</label>
    <select id="when" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Primavera 1975 - ore 18:00</option>
        <option>Estate 1976 - ore 22:30</option>
        <option>Inverno 1974 - ore 03:00</option>
        <option>Autunno 1977 - ore 11:15</option>
        <option>Estate 1976 - ore 07:45</option>
    </select>

    <label>Perché</label>
    <select id="why" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Paura delle conseguenze</option>
        <option>Vendetta personale</option>
        <option>Fanatismo religioso</option>
        <option>Errore di comunicazione</option>
        <option>Proteggere la parrocchia</option>
    </select>

    <p id="status"></p>
</div>

<!-- PAGINA 3 -->
<div id="thirdPage" class="page">
    <div class="archive-title">Archivio moderno</div>

    <div id="lockedMsg" class="lock-msg">Articolo non ancora disponibile</div>

    <div id="unlockedContent" style="display:none;">
        <img src="https://via.placeholder.com/900x400.png?text=Articolo+Moderno" />
    </div>
</div>

</div>

<script>

const correct = {
    who: "Il capocantiere",
    what: "Insabbiamento di un incidente",
    where: "Seminterrato della parrocchia",
    when: "Estate 1976 - ore 22:30",
    why: "Paura delle conseguenze"
};

function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page).classList.add('active');
}

function saveState() {
    const state = {
        who: document.getElementById('who').value,
        what: document.getElementById('what').value,
        where: document.getElementById('where').value,
        when: document.getElementById('when').value,
        why: document.getElementById('why').value
    };

    localStorage.setItem('game5w', JSON.stringify(state));
    checkUnlock();
}

function loadState() {
    const saved = JSON.parse(localStorage.getItem('game5w') || '{}');

    Object.keys(saved).forEach(k => {
        const el = document.getElementById(k);
        if (el) el.value = saved[k];
    });

    checkUnlock();
}

function checkUnlock() {
    const state = JSON.parse(localStorage.getItem('game5w') || '{}');

    const unlocked = Object.keys(correct).every(k => state[k] === correct[k]);

    if (unlocked) {
        document.getElementById('lockedMsg').style.display = 'none';
        document.getElementById('unlockedContent').style.display = 'block';
    }
}

// navigation libera

const navBar = document.createElement('div');
navBar.style.marginBottom = '20px';
navBar.style.display = 'flex';
navBar.style.justifyContent = 'center';
navBar.style.gap = '10px';

navBar.innerHTML = `
<button onclick="showPage('firstPage')">Articolo 1976</button>
<button onclick="showPage('secondPage')">Report Indagine</button>
<button onclick="showPage('thirdPage')">Articolo 2026</button>
`;

document.querySelector('.container').prepend(navBar);


document.getElementById('proseguiBtn').addEventListener('click', () => {
    showPage('secondPage');
});

loadState();
checkUnlock();

</script>

</body>
</html>
