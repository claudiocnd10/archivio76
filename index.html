<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivio 76</title>

<style>

body {
    overflow-x: hidden;
    margin: 0;
    background: #0d0d0d;
    color: #e7dcc3;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
}

.container {
    width: 100%;
    max-width: 1000px;
    text-align: center;
}

.page {
    display: none;
    position: relative;
}

.page.active {
    display: block;
}

#secondPage,
#thirdPage {
    text-align: left;
    background: #161616;
    border: 1px solid #333;
    padding: 40px;
    margin-top: 20px;
    min-height: 60vh;
}

/* TESTI */

.top-text {
    color: #7e7463;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 12px;
    margin-bottom: 20px;
}

.landing-title {
    font-size: 52px;
    color: #d8ccb0;
    letter-spacing: 6px;
    margin-bottom: 20px;
    line-height: 1.1;
    text-transform: uppercase;
}

.landing-subtitle {
    color: #8c826f;
    margin-bottom: 50px;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 14px;
}

.article-box {
    background: #111;
    border: 1px solid #333;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    overflow: hidden;
}

.article-box img {
    width: 100%;
    display: block;
}

/* BOTTONI GENERALI */

button {
    background: #1a1a1a;
    border: 1px solid #444;
    color: #e7dcc3;
    padding: 16px 40px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 4px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #262626;
}

/* BOTTONI NAV PAGINA */

.page-btn {
    position: absolute;
    bottom: 25px;
    min-width: 220px;
}

.bottom-right {
    right: 25px;
}

.bottom-left {
    left: 25px;
}

.disabled-btn {
    opacity: 0.3;
    cursor: not-allowed;
    pointer-events: none;
}

/* FORM */

select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    margin-bottom: 20px;
    background: #111;
    color: #e7dcc3;
    border: 1px solid #444;
}

.archive-title {
    font-size: 42px;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: #d8ccb0;
}

.archive-subtitle {
    color: #8c826f;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
    font-size: 14px;
}

.lock-msg {
    opacity: 0.5;
    text-align: center;
    padding: 40px;
}

#unlockedContent img {
    width: 100%;
    display: block;
}

/* LANDING */

.container {
    width: 100%;
    max-width: 1000px;
    text-align: center;
}

/* RESPONSIVE */

@media (max-width: 700px) {

    .landing-title {
        font-size: 34px;
    }

    button {
        width: auto;
        font-size: 12px;
        padding: 12px 20px;
        letter-spacing: 2px;
    }

    /* 🔥 FIX VERO */
    .page-btn {
		position: absolute;
		bottom: 25px;

		min-width: 0;
		max-width: 180px;     /* 🔥 stringe il bottone */

		padding: 14px 16px;   /* leggermente più compatto */
		font-size: 12px;
		letter-spacing: 2px;
		line-height: 1.2;

		white-space: normal;   /* 🔥 va a capo */
		word-break: break-word; /* 🔥 spezza le parole se serve */
		text-align: center;
	}

    .bottom-left {
		left: 15px;
	}

	.bottom-right {
		right: 15px;
	}
	
}

</style>
</head>

<body>

<!-- LANDING -->

<div id="landingPage" class="container">

    <div style="text-align:center; padding:80px 20px;">

        <h1 class="landing-title">
            ARCHIVIO INVESTIGATIVO<br>CENTRALE
        </h1>

        <p class="landing-subtitle">
            Accesso consultazione riservato
        </p>

        <button id="enterArchiveBtn">
            Caso 76-08-LS
        </button>

    </div>

</div>

<!-- ARCHIVIO -->

<div class="container" id="archiveContainer" style="display:none;">

<!-- PAGINA 1 -->

<div id="firstPage" class="page active">

    <div class="top-text">
        ARCHIVIO INVESTIGATIVO CENTRALE • ACCESSO CONSULTAZIONE RISERVATO
    </div>

    <div class="article-box">
        <img src="img/articolo76.png" alt="Articolo 1976">
    </div>

    <button class="page-btn bottom-right"
            onclick="showPage('secondPage')">
        Rapporto investigativo
    </button>

</div>

<!-- PAGINA 2 -->

<div id="secondPage" class="page">

    <div class="archive-title">
        Rapporto Investigativo
    </div>

    <div class="archive-subtitle">
        compilazione dati mancanti del caso 76-08-LS
    </div>

    <label>Soggetto coinvolto</label>
    <select id="who" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Il parroco</option>
        <option>Un operaio</option>
        <option>Il capocantiere</option>
        <option>Suor Agnese</option>
        <option>Un testimone</option>
    </select>

    <label>Natura dell’evento</label>
    <select id="what" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Un crollo accidentale</option>
        <option>La fuga di una suora</option>
        <option>Insabbiamento di un incidente</option>
        <option>Un furto nella parrocchia</option>
        <option>Un errore durante i lavori</option>
    </select>

    <label>Luogo del fatto</label>
    <select id="where" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Sagrestia</option>
        <option>Campanile</option>
        <option>Seminterrato della parrocchia</option>
        <option>Cortile interno</option>
        <option>Archivio della chiesa</option>
    </select>

    <label>Data e orario</label>
    <select id="when" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>2 agosto 1976 - ore 18:00</option>
        <option>2 agosto 1976 - ore 22:30</option>
        <option>1 agosto 1976 - ore 22:00</option>
        <option>3 agosto 1976 - ore 18:00</option>
        <option>4 agosto 1976 - ore 22:30</option>
    </select>

    <label>Possibile movente</label>
    <select id="why" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Paura delle conseguenze</option>
        <option>Vendetta personale</option>
        <option>Fanatismo religioso</option>
        <option>Errore di comunicazione</option>
        <option>Proteggere la parrocchia</option>
    </select>

    <button class="page-btn bottom-left"
            onclick="showPage('firstPage')">
        Reperto correlato
    </button>

    <button id="finalBtn"
            class="page-btn bottom-right disabled-btn"
            onclick="showPage('thirdPage')">
        Esito rapporto
    </button>

</div>

<!-- PAGINA 3 -->

<div id="thirdPage" class="page">

    <div class="archive-title">
        Esito Rapporto
    </div>

    <div id="lockedMsg" class="lock-msg">

        <h2>ACCESSO NEGATO</h2>

        <p>Compilare il rapporto investigativo per procedere.</p>

    </div>

    <div id="unlockedContent" style="display:none;">
        <img src="img/report26.png" alt="Esito Rapporto">
    </div>

</div>

</div>

<script>

const correct = {
    who: "Il capocantiere",
    what: "Insabbiamento di un incidente",
    where: "Seminterrato della parrocchia",
    when: "2 agosto 1976 - ore 22:30",
    why: "Paura delle conseguenze"
};

function showPage(page) {

    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page).classList.add('active');

    // 🔥 ogni volta che entri nella pagina 2 ricalcoli lo stato
    if (page === 'secondPage') {
        checkUnlock();
    }
}

function enterArchive() {
    document.getElementById('landingPage').style.display = 'none';
    document.getElementById('archiveContainer').style.display = 'block';
    showPage('firstPage');
}

function saveState() {

    const state = {
        who: document.getElementById('who').value,
        what: document.getElementById('what').value,
        where: document.getElementById('where').value,
        when: document.getElementById('when').value,
        why: document.getElementById('why').value
    };

    localStorage.setItem('game5w', JSON.stringify(state));

    checkUnlock();
}

function checkUnlock() {

    const state = JSON.parse(localStorage.getItem('game5w') || '{}');

    const unlocked = Object.keys(correct).every(k => {
		const a = (state[k] || "").trim().toLowerCase();
		const b = correct[k].trim().toLowerCase();
		return a === b;
	});

    const btn = document.getElementById('finalBtn');

	if (btn) {

		if (unlocked) {

			btn.style.display = 'block';
			btn.classList.remove('disabled-btn');

		} else {

			btn.style.display = 'none';
			btn.classList.add('disabled-btn');

		}
	}

    document.getElementById('lockedMsg').style.display = unlocked ? 'none' : 'block';
    document.getElementById('unlockedContent').style.display = unlocked ? 'block' : 'none';
}

window.addEventListener('DOMContentLoaded', () => {

    document.getElementById('enterArchiveBtn')
        .addEventListener('click', enterArchive);

    const saved = JSON.parse(localStorage.getItem('game5w') || '{}');

    Object.keys(saved).forEach(k => {
        const el = document.getElementById(k);
        if (el) el.value = saved[k];
    });

    checkUnlock();
});

</script>

</body>
</html>
