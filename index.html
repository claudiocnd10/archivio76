<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivio 76</title>

<style>

body {
    overflow-x: hidden;
    margin: 0;
    background: #0d0d0d;
    color: #e7dcc3;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
}

.container {
    width: 100%;
    max-width: 1000px;
    text-align: center;
}

.page {
    display: none;
    position: relative;
}

.page.active {
    display: block;
}

#firstPage,
#secondPage,
#thirdPage {
    text-align: left;
    background: #161616;
    border: 1px solid #333;
    padding: 40px;
    padding-bottom: 20px;
    margin-top: 20px;
    min-height: 60vh;
}

/* TESTI */

.top-text {
    color: #7e7463;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 12px;
    margin-bottom: 20px;
}

.landing-title {
    font-size: 52px;
    color: #d8ccb0;
    letter-spacing: 6px;
    margin-bottom: 20px;
    line-height: 1.1;
    text-transform: uppercase;
}

.landing-subtitle {
    color: #8c826f;
    margin-bottom: 50px;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 14px;
}

.article-box {
    overflow: hidden;
}

.article-box img {
    width: 100%;
    display: block;
}

/* BOTTONI GENERALI */

button {
    background: #1a1a1a;
    border: 1px solid #444;
    color: #e7dcc3;
    padding: 16px 40px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 4px;
    cursor: pointer;
    transition: 0.3s;
    box-sizing: border-box;
}

button:hover {
    background: #262626;
}

/* BARRA NAVIGAZIONE — sempre flex, sempre affiancata */

.nav-bar {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 0;
    margin-top: 30px;
    width: 100%;
}

/* Ogni slot occupa sempre il 50% */
.nav-bar .nav-slot {
    flex: 0 0 50%;
    width: 50%;
    display: flex;
}

/* Pulsante dentro lo slot occupa tutta la larghezza e altezza dello slot */
.nav-bar .nav-slot button {
    width: 100%;
    padding: 16px 10px;
    text-align: center;
}

/* Slot vuoto: placeholder invisibile per mantenere l'allineamento */
.nav-bar .nav-slot.empty {
    /* niente, solo occupa spazio */
}

/* Pulsante disabilitato: occupa spazio ma è invisibile */
.disabled-btn {
    visibility: hidden;
    pointer-events: none;
}

/* FORM */

select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    margin-bottom: 20px;
    background: #111;
    color: #e7dcc3;
    border: 1px solid #444;
}

.archive-title {
    font-size: 42px;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: #d8ccb0;
}

.archive-subtitle {
    color: #8c826f;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
    font-size: 14px;
}

.lock-msg {
    opacity: 0.5;
    text-align: center;
    padding: 40px;
}

#unlockedContent img {
    width: 100%;
    display: block;
}

/* REPORT TEXT REVEAL */

#reportText {
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    line-height: 1.85;
    color: #c9bfa8;
    white-space: pre-wrap;
}

.report-block {
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 1s ease, transform 1s ease;
    margin-bottom: 12px;
}

.report-block.visible {
    opacity: 1;
    transform: translateY(0);
}

.report-block.heading {
    color: #d8ccb0;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 28px;
    margin-bottom: 6px;
    font-size: 12px;
    border-bottom: 1px solid #2e2e2e;
    padding-bottom: 6px;
}

.report-block.meta {
    color: #7e7463;
    font-size: 12px;
    letter-spacing: 1px;
}

.report-block.list-item {
    padding-left: 20px;
    color: #a89e8a;
}

.report-block.list-item::before {
    content: "— ";
    color: #5a5040;
}

.report-block.separator {
    border-top: 1px solid #222;
    margin: 20px 0;
    opacity: 0;
    transition: opacity 0.6s ease;
}

.report-block.separator.visible {
    opacity: 1;
}

.report-header-block {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid #2a2a2a;
}

.report-header-block .report-block {
    display: block;
}

.stamp {
    display: inline-block;
    border: 2px solid #3a3020;
    color: #5a4e38;
    font-size: 10px;
    letter-spacing: 3px;
    padding: 6px 16px;
    text-transform: uppercase;
    margin-top: 30px;
}

/* RESPONSIVE */

@media (max-width: 700px) {

    .landing-title {
        font-size: 34px;
    }

    button {
        font-size: 12px;
        letter-spacing: 2px;
    }

    #firstPage,
    #secondPage,
    #thirdPage {
        padding: 20px;
        padding-bottom: 15px;
    }

}

</style>
</head>

<body>

<!-- LANDING -->

<div id="landingPage" class="container">

    <div style="text-align:center; padding:80px 20px;">

        <h1 class="landing-title">
            ARCHIVIO INVESTIGATIVO<br>CENTRALE
        </h1>

        <p class="landing-subtitle">
            Accesso consultazione riservato
        </p>

        <button id="enterArchiveBtn">
            Caso 76-08-LS
        </button>

    </div>

</div>

<!-- ARCHIVIO -->

<div class="container" id="archiveContainer" style="display:none;">

<!-- PAGINA 1 -->

<div id="firstPage" class="page active">

    <div class="archive-title">
        Reperto Correlato
    </div>

    <div class="archive-subtitle">
        reperto documentale del caso 76-08-LS
    </div>

    <div class="article-box">
        <img src="img/articolo76.png" alt="Articolo 1976">
    </div>

    <!-- Pagina 1: solo pulsante a destra → slot sinistro vuoto -->
    <div class="nav-bar">
        <div class="nav-slot empty"></div>
        <div class="nav-slot">
            <button onclick="showPage('secondPage')">Rapporto investigativo</button>
        </div>
    </div>

</div>

<!-- PAGINA 2 -->

<div id="secondPage" class="page">

    <div class="archive-title">
        Rapporto Investigativo
    </div>

    <div class="archive-subtitle">
        compilazione dati mancanti del caso 76-08-LS
    </div>

    <label>Soggetto coinvolto</label>
    <select id="who" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Il parroco</option>
        <option>Un operaio</option>
        <option>Il capocantiere</option>
        <option>Suor Agnese</option>
        <option>Un testimone</option>
    </select>

    <label>Natura dell'evento</label>
    <select id="what" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Un crollo accidentale</option>
        <option>La fuga di una suora</option>
        <option>Insabbiamento di un incidente</option>
        <option>Un furto nella parrocchia</option>
        <option>Un errore durante i lavori</option>
    </select>

    <label>Luogo del fatto</label>
    <select id="where" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Sagrestia</option>
        <option>Campanile</option>
        <option>Seminterrato della parrocchia</option>
        <option>Cortile interno</option>
        <option>Archivio della chiesa</option>
    </select>

    <label>Data e orario</label>
    <select id="when" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>2 agosto 1976 - ore 20:30</option>
        <option>2 agosto 1976 - ore 22:30</option>
        <option>2 agosto 1976 - ore 21:00</option>
        <option>2 agosto 1976 - ore 22:00</option>
        <option>2 agosto 1976 - ore 21:30</option>
    </select>

    <label>Possibile movente</label>
    <select id="why" onchange="saveState()">
        <option value="">-- scegli --</option>
        <option>Paura delle conseguenze</option>
        <option>Vendetta personale</option>
        <option>Fanatismo religioso</option>
        <option>Errore di comunicazione</option>
        <option>Proteggere la parrocchia</option>
    </select>

    <!-- Pagina 2: due pulsanti affiancati -->
    <div class="nav-bar">
        <div class="nav-slot">
            <button onclick="showPage('firstPage')">Reperto correlato</button>
        </div>
        <div class="nav-slot">
            <button id="finalBtn"
                    class="disabled-btn"
                    onclick="showPage('thirdPage')">
                Esito rapporto
            </button>
        </div>
    </div>

</div>

<!-- PAGINA 3 -->

<div id="thirdPage" class="page">

    <div class="archive-title">
        Esito Rapporto
    </div>

    <div id="lockedMsg" class="lock-msg">

        <h2>ACCESSO NEGATO</h2>

        <p>Compilare il rapporto investigativo per procedere.</p>

    </div>

    <div id="unlockedContent" style="display:none;">

        <div id="reportText"></div>

    </div>

</div>

</div>

<script>

const correct = {
    who: "Il capocantiere",
    what: "Insabbiamento di un incidente",
    where: "Seminterrato della parrocchia",
    when: "2 agosto 1976 - ore 22:30",
    why: "Paura delle conseguenze"
};

function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page).classList.add('active');

    if (page === 'secondPage') {
        checkUnlock();
    }

    if (page === 'thirdPage') {
        reportAnimated = false;
        revealReport();
    }
}

function enterArchive() {
    document.getElementById('landingPage').style.display = 'none';
    document.getElementById('archiveContainer').style.display = 'block';
    showPage('firstPage');
}

function saveState() {

    const state = {
        who: document.getElementById('who').value,
        what: document.getElementById('what').value,
        where: document.getElementById('where').value,
        when: document.getElementById('when').value,
        why: document.getElementById('why').value
    };

    localStorage.setItem('game5w', JSON.stringify(state));

    checkUnlock();
}

function checkUnlock() {

    const state = JSON.parse(localStorage.getItem('game5w') || '{}');

    const unlocked = Object.keys(correct).every(k => {
        const a = (state[k] || "").trim().toLowerCase();
        const b = correct[k].trim().toLowerCase();
        return a === b;
    });

    const btn = document.getElementById('finalBtn');

    if (btn) {
        if (unlocked) {
            btn.classList.remove('disabled-btn');
        } else {
            btn.classList.add('disabled-btn');
        }
    }

    document.getElementById('lockedMsg').style.display = unlocked ? 'none' : 'block';
    document.getElementById('unlockedContent').style.display = unlocked ? 'block' : 'none';
}

window.addEventListener('DOMContentLoaded', () => {

    document.getElementById('enterArchiveBtn')
        .addEventListener('click', enterArchive);

    const saved = JSON.parse(localStorage.getItem('game5w') || '{}');

    Object.keys(saved).forEach(k => {
        const el = document.getElementById(k);
        if (el) el.value = saved[k];
    });

    checkUnlock();
});

</script>

<script>

let reportBlocks;

function buildReportBlocks() {
    const oggi = new Date();
    const mesiIT = ["gennaio","febbraio","marzo","aprile","maggio","giugno",
                    "luglio","agosto","settembre","ottobre","novembre","dicembre"];
    const dataOggi = `Foggia, ${oggi.getDate()} ${mesiIT[oggi.getMonth()]} ${oggi.getFullYear()}`;

    reportBlocks = [
    { type: "heading", text: "Gruppo Issimi — Parrocchia di San Nicola" },
    { type: "heading", text: "Rapporto Conclusivo di Indagine" },
    { type: "meta", text: "Procedimento n. 2147/26 — \"Caso Lorusso\"" },
    { type: "separator" },
    { type: "heading", text: "Oggetto" },
    { type: "text", text: "Risoluzione del caso relativo alla scomparsa della religiosa:" },
    { type: "text", text: "CELESTE LORUSSO\nnata a Conversano (BA) il 12/03/1950\nscomparsa in data presumibile compresa tra il 2 e il 3 agosto 1976\npresso la Parrocchia Stella Maris di Marina di Lesina (FG)." },
    { type: "separator" },
    { type: "heading", text: "Premessa" },
    { type: "text", text: "In data 18 luglio 2026, durante lavori di consolidamento dei locali seminterrati della Parrocchia Stella Maris di Marina di Lesina, operai incaricati della ristrutturazione segnalavano il rinvenimento accidentale di una cavità muraria occultata dietro una parete in laterizio di vecchia costruzione." },
    { type: "text", text: "All'interno della cavità venivano rinvenuti:" },
    { type: "list-item", text: "resti umani parzialmente scheletrizzati" },
    { type: "list-item", text: "frammenti di abiti religiosi" },
    { type: "list-item", text: "effetti personali riconducibili alla religiosa Celeste Lorusso, scomparsa nel 1976" },
    { type: "text", text: "Il rinvenimento determinava la riapertura del procedimento relativo alla storica scomparsa." },
    { type: "separator" },
    { type: "heading", text: "Esiti delle Indagini" },
    { type: "text", text: "Le successive attività investigative, svolte dal Gruppo Issimi della Parrocchia di San Nicola, consentivano di ricostruire quanto segue." },
    { type: "text", text: "Nel periodo estivo del 1976 erano in corso lavori non autorizzati di ampliamento e consolidamento dei locali inferiori della struttura parrocchiale. Tali lavori risultavano coordinati informalmente dal capocantiere:" },
    { type: "text", text: "COSIMO LAMACCHIA\nnato a Lesina (FG) il 08/11/1938\ndeceduto nel 2009." },
    { type: "text", text: "Secondo le testimonianze raccolte e la documentazione recuperata, nella serata del 2 agosto 1976, intorno alle ore 22:30, la religiosa Celeste Lorusso si recava nei locali sotterranei della parrocchia per visionare il lavoro svolto dagli operai, in particolare ad un'intercapedine muraria nel sotterraneo." },
    { type: "text", text: "Le attività investigative hanno consentito di accertare che la religiosa, per cause ritenute accidentali, rimaneva intrappolata all'interno dell'intercapedine. La parete interessata veniva ultimata e sigillata durante la mattina successiva, senza che gli operai presenti avessero inizialmente compreso l'effettiva presenza della donna all'interno della cavità." },
    { type: "text", text: "Elementi testimoniali acquisiti nel corso delle indagini indicano che, nelle ore successive alla chiusura della parete, alcuni operai avrebbero udito colpi e rumori provenire dall'intercapedine appena realizzata. Tali segnalazioni non venivano tuttavia approfondite, essendo inizialmente attribuite a fenomeni di assestamento strutturale o a suggestione." },
    { type: "separator" },
    { type: "heading", text: "Insabbiamento" },
    { type: "text", text: "Le indagini hanno evidenziato che il capocantiere Cosimo Lamacchia, dopo cinque giorni, a seguito delle voci messe in circolo dagli operai presenti e del personale rinvenimento di un rosario riconducibile alla religiosa nei pressi della parete appena ultimata, avrebbe compreso la possibile presenza della donna all'interno dell'intercapedine muraria." },
    { type: "text", text: "Temendo conseguenze penali derivanti dall'irregolarità dei lavori e dalle condizioni di sicurezza del cantiere, oltre che dal probabile femminicidio, Lamacchia decideva tuttavia di non procedere alla demolizione della parete né di informare immediatamente le autorità." },
    { type: "text", text: "Non sono emersi elementi idonei a dimostrare il coinvolgimento diretto del parroco dell'epoca, don Ernesto Capuano, né di altri appartenenti alla struttura ecclesiastica." },
    { type: "separator" },
    { type: "heading", text: "Accertamenti Tecnici" },
    { type: "text", text: "Gli esami antropologici e forensi eseguiti presso il RIS di Roma hanno confermato la compatibilità dei resti con Celeste Lorusso attraverso:" },
    { type: "list-item", text: "analisi genetiche comparative" },
    { type: "list-item", text: "reperti personali" },
    { type: "list-item", text: "corrispondenza anagrafica" },
    { type: "text", text: "La configurazione della cavità muraria e la posizione dei resti risultano coerenti con una permanenza forzata, seppur accidentale, all'interno dell'intercapedine al momento della chiusura della parete." },
    { type: "separator" },
    { type: "heading", text: "Conclusioni" },
    { type: "text", text: "Alla luce degli elementi raccolti, si ritiene che:" },
    { type: "list-item", text: "la morte di Celeste Lorusso sia avvenuta in conseguenza di un evento accidentale verificatosi durante lavori edilizi irregolari" },
    { type: "list-item", text: "la successiva mancata segnalazione dell'accaduto abbia determinato l'occultamento del corpo per circa cinquant'anni" },
    { type: "list-item", text: "il principale responsabile dell'insabbiamento debba individuarsi nel capocantiere Cosimo Lamacchia, deceduto prima della riapertura delle indagini" },
    { type: "text", text: "Con il presente rapporto si propone l'archiviazione definitiva del procedimento per intervenuto decesso dell'unico soggetto ritenuto penalmente responsabile." },
    { type: "separator" },
    { type: "meta", text: dataOggi },
    { type: "meta", text: "Gruppo Issimi della Parrocchia di San Nicola" },
    { type: "stamp", text: "✦  ARCHIVIATO  ✦" },
];
}

let reportAnimated = false;

function buildReportDOM() {
    const container = document.getElementById('reportText');
    container.innerHTML = '';
    reportBlocks.forEach((block, i) => {
        if (block.type === 'separator') {
            const hr = document.createElement('hr');
            hr.className = 'report-block separator';
            hr.dataset.index = i;
            container.appendChild(hr);
        } else if (block.type === 'stamp') {
            const div = document.createElement('div');
            div.className = 'report-block stamp';
            div.dataset.index = i;
            div.textContent = block.text;
            container.appendChild(div);
        } else {
            const div = document.createElement('div');
            div.className = 'report-block ' + block.type;
            div.dataset.index = i;
            div.textContent = block.text;
            container.appendChild(div);
        }
    });
}

function revealReport() {
    if (reportAnimated) return;
    reportAnimated = true;

    buildReportBlocks();
    buildReportDOM();

    const blocks = document.querySelectorAll('.report-block');
    blocks.forEach((el, i) => {
        setTimeout(() => {
            el.classList.add('visible');
        }, 400 * i);
    });
}

</script>

</body>
</html>
